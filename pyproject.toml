[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultroute-rag"
version = "0.1.0"
description = "Secure, permission-aware enterprise RAG with semantic caching and intelligent model routing."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.15,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "fastembed>=0.7,<1",
    "httpx>=0.28,<1",
    "pypdf>=6,<7",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.20,<1.21",
    "sqlalchemy[asyncio]>=2.0.38,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vaultroute_rag = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

